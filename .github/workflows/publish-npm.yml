name: Publish @voline/log-dashboard to npm

on:
  release:
    types: [published]
    paths:
      - 'volinecore/dashboard/**'

defaults:
  run:
    working-directory: volinecore/dashboard

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: volinecore/dashboard/package-lock.json
      - run: npm ci
      - run: npm run build:lib
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
